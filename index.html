<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emberfall — From Blacksmith to Emperor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <header id="top">
    <div id="resbar"></div>
    <div id="daybox"></div>
  </header>

  <aside id="left"></aside>
  <aside id="side" class="hidden"></aside>
  <footer id="bottom"></footer>

  <div id="hoverpop" class="hidden"></div>
  <div id="placehint" class="hidden"></div>
  <div id="toasts"></div>
  <div id="floaters"></div>

  <div id="modal" class="hidden">
    <div class="modal-inner">
      <div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="close">✕</button></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="report" class="hidden"></div>
  <div id="intro" class="hidden"></div>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
